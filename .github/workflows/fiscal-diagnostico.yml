name: Core Orca Fiscal V058.7 - Diagnostico
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fiscal-diagnostico
  cancel-in-progress: false
jobs:
  diagnostico:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fiscal-diagnostico
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testar SEFIN sem emitir notas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CORE_ORCA_WORKER_TOKEN: ${{ secrets.CORE_ORCA_WORKER_TOKEN }}
        run: node fiscal-worker/diagnostico.mjs
