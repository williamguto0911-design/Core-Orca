name: Core Orca Fiscal V059.1 - Homologacao
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fiscal-homolog
  cancel-in-progress: false
jobs:
  homolog:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fiscal-diagnostico
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar ferramentas XML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xmlsec1 python3-lxml
      - name: Validar e assinar DPS de teste
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CORE_ORCA_HOMOLOG_TOKEN: ${{ secrets.CORE_ORCA_HOMOLOG_TOKEN }}
          FISCAL_ENVIAR: 'NAO'
        run: node fiscal-worker/homolog.mjs
