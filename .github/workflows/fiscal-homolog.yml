name: Fiscal - Homologacao
on:
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Transmitir DPS exclusivamente em producao restrita?'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fiscal-homolog
  cancel-in-progress: false
jobs:
  homolog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y python3-lxml openssl
      - name: Validar e assinar DPS de teste
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CORE_ORCA_HOMOLOG_TOKEN: ${{ secrets.CORE_ORCA_HOMOLOG_TOKEN }}
          FISCAL_ENVIAR: ${{ inputs.enviar && 'SIM' || 'NAO' }}
        run: node fiscal-worker/homolog.mjs
